name: Shortcuts Hub iOS Build
on:
  push:
    branches:
      - feature/shortcuts-hub-integration
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install CocoaPods
        run: pod install
      - name: Build simulator without signing
        run: |
          set -o pipefail
          xcodebuild -workspace Bark.xcworkspace -scheme Bark -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
