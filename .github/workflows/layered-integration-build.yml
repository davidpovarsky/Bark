name: Layered Integration iOS Build
on:
  push:
    branches: [feature/source-layered-integration]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate integration overlay
        run: python3 Integration/Scripts/apply_overlay.py
      - name: Generate original Deflector UI and navigation overlay
        run: python3 Integration/Scripts/apply_ui_overlay.py
      - name: Verify original Deflector UI navigation overlay
        run: python3 Integration/Scripts/verify_ui_overlay.py
      - name: Verify selective notification cleanup overlay
        run: |
          python3 Integration/Scripts/verify_cleanup_overlay.py
          git diff --exit-code -- Vendor/Deflector
      - name: Install CocoaPods
        run: pod install
      - name: Build iOS simulator without signing
        run: |
          set -o pipefail
          xcodebuild -workspace Bark.xcworkspace -scheme Bark -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iOS device app
        run: |
          set -euo pipefail
          xcodebuild -workspace Bark.xcworkspace -scheme Bark -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/BarkDeviceBuild" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA with extensions
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BarkDeviceBuild/Build/Products/Release-iphoneos/Bark.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/BarkPayload/Payload"
          ditto "$APP" "$RUNNER_TEMP/BarkPayload/Payload/Bark.app"
          cd "$RUNNER_TEMP/BarkPayload"
          zip -qry "$GITHUB_WORKSPACE/Bark-Deflector-iOS-unsigned.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/Bark-Deflector-iOS-unsigned.ipa" | tail -n 1
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bark-Deflector-iOS-unsigned-IPA
          path: Bark-Deflector-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
